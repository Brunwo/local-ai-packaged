version: '3.8'

volumes:
  n8n_storage:
  ollama_storage:
  qdrant_storage:
  # open-webui:
  postgres_data:
  caddy-data:
  caddy-config:
  litellm_data:
  # Supabase volumes
  db-config:

# issues for localhost access, will need to be reactivated for supabase
# networks:
#   ai_network:
#     driver: bridge

services:
  # PostgreSQL Database - INTERNAL ONLY
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: litellmdb,n8ndb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # N8N Workflow Automation - INTERNAL ONLY
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_USER=n8ndb
      - DB_POSTGRESDB_PASSWORD=n8ndb
      - DB_POSTGRESDB_DATABASE=n8ndb
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET}
      - WEBHOOK_URL=http://localhost:5678
    # No external ports - internal access only
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./shared:/data/shared
    depends_on:
      db:
        condition: service_healthy


  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    # Remove public port exposure - only accessible via Tailscale
    # ports:
    #   - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=https://${SEARXNG_HOSTNAME:-localhost}/
      - UWSGI_WORKERS=${SEARXNG_UWSGI_WORKERS:-4}
      - UWSGI_THREADS=${SEARXNG_UWSGI_THREADS:-4}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  # Ollama for Local LLMs - LOCALHOST ACCESS ENABLED
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"  # Localhost only - secure binding
    environment:
      - OLLAMA_CONTEXT_LENGTH=8192
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_MAX_LOADED_MODELS=2
    volumes:
      - ollama_storage:/root/.ollama

  # Open WebUI for Chat Interface - ACCESSED VIA CADDY ONLY
  # open-webui:
  #   image: custom-open-webui:latest
  #   restart: unless-stopped
  #   # No external ports - accessed through Caddy reverse proxy only
  #   volumes:
  #     - open-webui:/app/backend/data
  #   depends_on:
  #     - ollama
  #   environment:
  #     # - OLLAMA_BASE_URL=https://ollama-gateway-91dzchmc.ew.gateway.dev
  #     # - OLLAMA_API_KEY=${OLLAMA_API_KEY}
  #     - ENABLE_FORWARD_USER_INFO_HEADERS=True


  # Qdrant Vector Database - INTERNAL ONLY
  qdrant:
    image: qdrant/qdrant
    restart: unless-stopped
    # No external ports - internal access only
    volumes:
      - qdrant_storage:/qdrant/storage

  # Ollama Model Puller (runs once to download models)
  ollama-init:
    image: ollama/ollama:latest
    volumes:
      - ollama_storage:/root/.ollama
    entrypoint: /bin/sh
    command:
      - "-c"
      - "sleep 5; OLLAMA_HOST=ollama:11434 ollama pull qwen3:4b-instruct-2507-q4_K_M; OLLAMA_HOST=ollama:11434 ollama pull embeddinggemma"
    depends_on:
      - ollama
    profiles:
      - init

  litellm:
    image: ghcr.io/berriai/litellm-database:main-stable
    container_name: litellm
    ports:
      - "4000:4000"                        # LiteLLM API port
    environment:
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      # Master key for administrative operations
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      # PostgreSQL URL for persistent usage tracking and budgets
      DATABASE_URL: "postgresql://litellmdb:${LITELLMDB_PASSWORD}@db:5432/litellmdb"
      # Enable user header parsing to enforce per-user quotas
      LITELLM_USER_HEADER_NAME: "X-OpenWebUI-User-Id"
      # Global proxy budget defaults (e.g., $25/month per user)
      LITELLM_MAX_INTERNAL_USER_BUDGET: "25.00"
      LITELLM_INTERNAL_USER_BUDGET_DURATION: "1mo"
      # Example rate limits
      LITELLM_DEFAULT_RPM_LIMIT: "60"
      LITELLM_DEFAULT_TPM_LIMIT: "20000"

      #secu
      # LITELLM_SALT_KEY

      # Port configuration
      PORT: "4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - litellm_data:/var/lib/litellm/db
    depends_on:
      db:
        condition: service_healthy
  # Caddy Reverse Proxy - Only exposes frontend UI
  caddy:
    container_name: caddy
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-addon:/etc/caddy/addons:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - WEBUI_HOSTNAME=st3p.org
      - LETSENCRYPT_EMAIL=quarantedouze@gmail.com
      - ALLOWED_IP=${ALLOWED_IP}
      - SEARXNG_HOSTNAME=${SEARXNG_HOSTNAME:-":8006"}
      # - OLLAMA_HOSTNAME=${OLLAMA_HOSTNAME}
      # - OLLAMA_TOKEN=${OLLAMA_TOKEN}
      # - GCLOUD_OLLAMA_API_GATEWAY_TOKEN=${GCLOUD_OLLAMA_API_GATEWAY_TOKEN}
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  litellm:
    image: ghcr.io/berriai/litellm:latest
    container_name: litellm
    ports:
      - "4000:4000"                        # LiteLLM API port
    environment:
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      # Master key for administrative operations
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      # PostgreSQL URL for persistent usage tracking and budgets
      LITELLM_DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/postgres"
      # Enable user header parsing to enforce per-user quotas
      LITELLM_USER_HEADER_NAME: "X-OpenWebUI-User-Id"
      # Global proxy budget defaults (e.g., $25/month per user)
      LITELLM_MAX_INTERNAL_USER_BUDGET: "25.00"
      LITELLM_INTERNAL_USER_BUDGET_DURATION: "1mo"
      # Example rate limits
      LITELLM_DEFAULT_RPM_LIMIT: "60"
      LITELLM_DEFAULT_TPM_LIMIT: "20000"

      #secu
      # LITELLM_SALT_KEY

      # Port configuration
      PORT: "4000"
    volumes:
      - ./litellm/config.yaml:/app/litellm_server/config.yaml:ro
      - litellm_data:/var/lib/litellm/db

  litellm-migrate:
    image: ghcr.io/berriai/litellm-database:main-stable
    environment:
      DATABASE_URL: postgresql://litellmdb:litellmdb@db:5432/litellmdb
    depends_on:
      db:
        condition: service_healthy
    command: ["prisma", "migrate", "deploy"]
    restart: "no"
